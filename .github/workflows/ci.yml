name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'

  install-test:
    name: Install test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run install script
        run: bash install.sh
      - name: Smoke test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ai_inject examples/my_project
          ai_done examples/my_project
          ai_progress examples/my_project
